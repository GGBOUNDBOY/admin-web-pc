<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>欢迎光临</title>
  <!--BUILD_TIME-->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --accent: #ffd166;
      --text: #ffffff;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
      color: var(--text);
      background: linear-gradient(135deg, #0f2027 0%, #203a43 45%, #2c5364 100%);
      overflow: hidden;
    }

    /* 动态背景光斑 */
    .bg-orbs {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.5;
      animation: float 18s ease-in-out infinite alternate;
    }

    .orb-1 {
      width: 42vmax;
      height: 42vmax;
      left: -10vmax;
      top: -12vmax;
      background: radial-gradient(circle, rgba(255, 122, 89, 0.55), transparent 70%);
    }

    .orb-2 {
      width: 36vmax;
      height: 36vmax;
      right: -8vmax;
      bottom: -10vmax;
      background: radial-gradient(circle, rgba(72, 202, 228, 0.55), transparent 70%);
      animation-delay: -6s;
    }

    .orb-3 {
      width: 26vmax;
      height: 26vmax;
      left: 45%;
      top: -8vmax;
      background: radial-gradient(circle, rgba(255, 209, 102, 0.5), transparent 70%);
      animation-delay: -12s;
    }

    @keyframes float {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(6vmax, 4vmax) scale(1.15); }
    }

    .card {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 4rem 5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(16px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      animation: fadeUp 1s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .name {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: 6px;
      color: var(--accent);
      margin-bottom: 0.8rem;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
      animation: fadeUp 1s ease both;
    }

    .welcome {
      font-size: 2rem;
      letter-spacing: 10px;
      color: rgba(255, 255, 255, 0.85);
      margin-bottom: 1.5rem;
    }

    .welcome span {
      color: var(--accent);
    }

    .date-main {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      margin-bottom: 0.6rem;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }

    .date-sub {
      font-size: 1.25rem;
      color: rgba(255, 255, 255, 0.75);
      letter-spacing: 4px;
      margin-bottom: 0.6rem;
    }

    .lunar {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.6);
      letter-spacing: 3px;
      margin-bottom: 1.6rem;
    }

    .clock {
      font-size: 2.4rem;
      font-weight: 300;
      letter-spacing: 6px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
    }

    .divider {
      width: 120px;
      height: 2px;
      margin: 1.8rem auto;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      border-radius: 2px;
    }

    .tip {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 2px;
    }

    @media (max-width: 640px) {
      .card { padding: 3rem 1.5rem; margin: 0 1rem; }
      .date-main { font-size: 2rem; }
      .clock { font-size: 1.8rem; }
    }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <div class="card">
    <div class="name" id="userName"></div>
    <div class="welcome">欢迎光临<span> · </span>Welcome</div>
    <div class="date-main" id="dateMain"></div>
    <div class="date-sub" id="dateSub"></div>
    <div class="lunar" id="lunarInfo"></div>
    <div class="clock" id="clock"></div>
    <div class="divider"></div>
    <div class="tip">每日更新 · 愿您度过美好的一天</div>
  </div>

  <script>
    const WEEK = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    const $dateMain = document.getElementById("dateMain");
    const $dateSub = document.getElementById("dateSub");

    // 中文数字（农历月日）
    const CN_NUM = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九"];

    // 随机姓名：常见百家姓 + 寓意用字（每次刷新重新生成）
    const SURNAMES = "赵钱孙李周吴郑王冯陈褚卫蒋沈韩杨朱秦尤许何吕施张孔曹严华金魏陶姜戚谢邹喻柏水窦章云苏潘葛奚范彭郎鲁韦昌马苗凤花方俞任袁柳丰鲍史唐费廉岑薛雷贺倪汤滕殷罗毕郝邬安常乐于时傅皮卞齐康伍余元卜顾孟平黄和穆萧尹".split("");
    const GIVEN_SINGLE = "安宁静悦然轩泽宇辰瑶瑾舒远明朗轩清嘉沐风若谷之恒书言思齐".split("");
    const GIVEN_WORDS = [
      "浩然", "思远", "若曦", "嘉禾", "清越", "知微", "景行", "明远", "安然", "若谷",
      "怀瑾", "书瑶", "语嫣", "修远", "沐辰", "星河", "知遥", "清和", "长风", "望舒",
      "晨曦", "安宁", "子轩", "志远", "静好", "云舒", "嘉言", "斯年", "维桢", "其琛"
    ];

    function randomName() {
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const surname = pick(SURNAMES);
      // 双字名优先（约 60%），单字名使用寓意单字
      if (Math.random() < 0.6) {
        return surname + pick(GIVEN_WORDS);
      }
      if (Math.random() < 0.7) {
        return surname + pick(GIVEN_SINGLE) + pick(GIVEN_SINGLE);
      }
      return surname + pick(GIVEN_SINGLE);
    }

    document.getElementById("userName").textContent = randomName();

    // 农历推算表（1900–2100 年）
    const LUNAR_INFO = [
      0x04bd8, 0x04ae0, 0x0a570, 0x054d5, 0x0d260, 0x0d950, 0x16554, 0x056a0, 0x09ad0, 0x055d2,
      0x04ae0, 0x0a5b6, 0x0a4d0, 0x0d250, 0x1d255, 0x0b540, 0x0d6a0, 0x0ada2, 0x095b0, 0x14977,
      0x04970, 0x0a4b0, 0x0b4b5, 0x06a50, 0x06d40, 0x1ab54, 0x02b60, 0x09570, 0x052f2, 0x04970,
      0x06566, 0x0d4a0, 0x0ea50, 0x06e95, 0x05ad0, 0x02b60, 0x186e3, 0x092e0, 0x1c8d7, 0x0c950,
      0x0d4a0, 0x1d8a6, 0x0b550, 0x056a0, 0x1a5b4, 0x025d0, 0x092d0, 0x0d2b2, 0x0a950, 0x0b557,
      0x06ca0, 0x0b550, 0x15355, 0x04da0, 0x0a5d0, 0x14573, 0x052d0, 0x0a9a8, 0x0e950, 0x06aa0,
      0x0aea6, 0x0ab50, 0x04b60, 0x0aae4, 0x0a570, 0x05260, 0x0f263, 0x0d950, 0x05b57, 0x056a0,
      0x096d0, 0x04dd5, 0x04ad0, 0x0a4d0, 0x0d4d4, 0x0d250, 0x0d558, 0x0b540, 0x0b5a0, 0x195a6,
      0x095b0, 0x049b0, 0x0a974, 0x0a4b0, 0x0b27a, 0x06a50, 0x06d40, 0x0af46, 0x0ab60, 0x09570,
      0x04af5, 0x04970, 0x064b0, 0x074a3, 0x0ea50, 0x06b58, 0x055c0, 0x0ab60, 0x096d5, 0x092e0,
      0x0c960, 0x0d954, 0x0d4a0, 0x0da50, 0x07552, 0x056a0, 0x0abb7, 0x025d0, 0x092d0, 0x0cab5,
      0x0a950, 0x0b4a0, 0x0baa4, 0x0ad50, 0x055d9, 0x04ba0, 0x0a5b0, 0x15176, 0x052b0, 0x0a930,
      0x07954, 0x06aa0, 0x0ad50, 0x05b52, 0x04b60, 0x0a6e6, 0x0a4e0, 0x0d260, 0x0ea65, 0x0d530,
      0x05aa0, 0x076a3, 0x096d0, 0x04afb, 0x04ad0, 0x0a4d0, 0x1d0b6, 0x0d250, 0x0d520, 0x0dd45,
      0x0b5a0, 0x056d0, 0x055b2, 0x049b0, 0x0a577, 0x0a4b0, 0x0aa50, 0x1b255, 0x06d20, 0x0ada0,
      0x14b63, 0x09370, 0x049f8, 0x04970, 0x064b0, 0x168a6, 0x0ea50, 0x06b20, 0x1a6c4, 0x0aae0,
      0x092e0, 0x0d2e3, 0x0c960, 0x0d557, 0x0d4a0, 0x0da50, 0x05d55, 0x056a0, 0x0a6d0, 0x055d4,
      0x052d0, 0x0a9b8, 0x0a950, 0x0b4a0, 0x0b6a6, 0x0ad50, 0x055a0, 0x0aba4, 0x0a5b0, 0x052b0,
      0x0b273, 0x06930, 0x07337, 0x06aa0, 0x0ad50, 0x14b55, 0x04b60, 0x0a570, 0x054e4, 0x0d160,
      0x0e968, 0x0d520, 0x0daa0, 0x16aa6, 0x056d0, 0x04ae0, 0x0a9d4, 0x0a2d0, 0x0d150, 0x0f252,
      0x0d520
    ];
    const LUNAR_START_YEAR = 1900;

    function leapMonth(year) {
      return LUNAR_INFO[year - LUNAR_START_YEAR] & 0xf;
    }

    function leapDays(year) {
      if (leapMonth(year)) {
        return (LUNAR_INFO[year - LUNAR_START_YEAR] & 0x10000) ? 30 : 29;
      }
      return 0;
    }

    function monthDays(year, month) {
      return (LUNAR_INFO[year - LUNAR_START_YEAR] & (0x10000 >> month)) ? 30 : 29;
    }

    function lYearDays(year) {
      let sum = 348;
      for (let i = 0x8000; i > 0x8; i >>= 1) {
        sum += (LUNAR_INFO[year - LUNAR_START_YEAR] & i) ? 1 : 0;
      }
      return sum + leapDays(year);
    }

    function getLunar(date) {
      const baseDate = new Date(1900, 0, 31); // 1900-01-31 即农历 1900 年正月初一
      let offset = Math.floor((date - baseDate) / 86400000);

      let year = LUNAR_START_YEAR;
      let temp = 0;
      for (; year < 2101 && offset > 0; year++) {
        temp = lYearDays(year);
        offset -= temp;
      }
      if (offset < 0) {
        offset += temp;
        year--;
      }
      const lunarYear = year;

      const leap = leapMonth(lunarYear);
      let isLeap = false;
      let month = 1;
      for (; month < 13 && offset > 0; month++) {
        if (leap > 0 && month === leap + 1 && !isLeap) {
          --month;
          isLeap = true;
          temp = leapDays(lunarYear);
        } else {
          temp = monthDays(lunarYear, month);
        }
        if (isLeap && month === leap + 1) {
          isLeap = false;
        }
        offset -= temp;
      }
      if (offset === 0 && leap > 0 && month === leap + 1) {
        if (isLeap) {
          isLeap = false;
        } else {
          isLeap = true;
          --month;
        }
      }
      if (offset < 0) {
        offset += temp;
        --month;
      }

      return {
        year: lunarYear,
        month,
        day: offset + 1,
        isLeap
      };
    }

    // 数字转中文（用于农历日：初一至三十）
    function numToCN(n) {
      if (n < 10) return CN_NUM[n];
      if (n === 10) return "十";
      if (n < 20) return "十" + CN_NUM[n % 10];
      return CN_NUM[Math.floor(n / 10)] + "十" + (n % 10 ? CN_NUM[n % 10] : "");
    }

    const GAN = ["甲", "乙", "丙", "丁", "戊", "己", "庚", "辛", "壬", "癸"];
    const ZHI = ["子", "丑", "寅", "卯", "辰", "巳", "午", "未", "申", "酉", "戌", "亥"];
    const CN_YEAR_MONTH = ["", "正", "二", "三", "四", "五", "六", "七", "八", "九", "十", "冬", "腊"];

    function render() {
      const now = new Date();
      const year = now.getFullYear();
      const month = now.getMonth() + 1;
      const day = now.getDate();
      const week = WEEK[now.getDay()];

      // 公历
      $dateMain.textContent = `${year} 年 ${month} 月 ${day} 日`;
      $dateSub.textContent = week;

      // 农历：干支纪年与农历正月初一略有差异（以立春为界），此处按农历年份简化展示
      const lunar = getLunar(now);
      const ganzhiYear = GAN[(lunar.year - 4) % 10] + ZHI[(lunar.year - 4) % 12];
      const monthName = (lunar.isLeap ? "闰" : "") + CN_YEAR_MONTH[lunar.month] + "月";
      const dayName = lunar.day === 1 ? "初一" : numToCN(lunar.day);
      const isFestival =
        lunar.month === 1 && lunar.day === 1 ? "春节" :
        lunar.month === 1 && lunar.day === 15 ? "元宵节" :
        lunar.month === 5 && lunar.day === 5 ? "端午节" :
        lunar.month === 7 && lunar.day === 7 ? "七夕" :
        lunar.month === 8 && lunar.day === 15 ? "中秋节" :
        lunar.month === 9 && lunar.day === 9 ? "重阳节" : null;

      document.getElementById("lunarInfo").textContent =
        `${ganzhiYear}年 · 农历${monthName}${dayName}${isFestival ? " · " + isFestival : ""}`;

      // 时间
      const pad = (n) => String(n).padStart(2, "0");
      document.getElementById("clock").textContent =
        `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    }

    render();
    setInterval(render, 1000);
    // 跨天时若月份/日期变化由每秒刷新自动覆盖
  </script>
</body>
</html>
